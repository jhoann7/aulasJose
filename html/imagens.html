<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens em HTML</title>
</head>
<body>
    <h1>Exemplos de Imagens em HTML</h1>

    <!-- Imagem com atributo alt -->
    <h2>Imagem com texto alternativo</h2>
    <img
        src="image3.png"
        alt="Imagem de exemplo com texto alternativo"
    >

    <!-- Imagem com largura de 300px -->
    <h2>Imagem com largura de 300 pixels</h2>
    <img
        src="image2.png"
        alt="Imagem redimensionada para 300 pixels de largura"
        width="300"
    >

    <!-- Imagem dentro de um link -->
    <h2>Imagem com link</h2>
    <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        <img
            src="image.png"
            alt="Clique para abrir o Google"
        >
    </a>

    <!-- Imagem com legenda -->
    <h2>Imagem com legenda</h2>
    <figure>
        <img
            src="https://via.placeholder.com/600x400"
            alt="Imagem com legenda"
            width="400"
        >
        <figcaption>
            Esta é uma legenda criada com as tags &lt;figure&gt; e
            &lt;figcaption&gt;.
        </figcaption>
    </figure>
</body>
</html>
