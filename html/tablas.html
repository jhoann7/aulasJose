<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
</head>
<body>
    <h1>Tabela de Produtos</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor (R$)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Notebook</td>
                <td>2</td>
                <td>3500,00</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>5</td>
                <td>80,00</td>
            </tr>
            <tr>
                <td>Teclado</td>
                <td>3</td>
                <td>150,00</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td>2</td>
                <td>1200,00</td>
            </tr>
            <tr>
                <td>Headset</td>
                <td>4</td>
                <td>250,00</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2"><strong>Total</strong></td>
                <td><strong>5180,00</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
