<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Texto</title>
</head>
<body>
    <h1>Exemplo de Formatação de Texto</h1>

    <p>
        Meu nome é <strong>Jhoann</strong> e sou estudante de
        <em>Tecnologia da Informação</em>.
    </p>

    <p>
        Atualmente estou aprendendo <u>HTML</u> e criando páginas web.
    </p>

    <p>
        O objetivo desta atividade é destacar informações
        <mark>importantes</mark>.
    </p>

    <p>
        <small>Este texto aparece em um tamanho menor.</small>
    </p>
</body>
</html>
